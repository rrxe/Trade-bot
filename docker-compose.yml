services:
  council:
    build: .
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      AUTH: ${AUTH:-}
      PORT: "8080"
      DATA_DIR: /data
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
      SUPABASE_TABLE: ${SUPABASE_TABLE:-council_state}
      SUPABASE_PUSH_SECONDS: ${SUPABASE_PUSH_SECONDS:-60}
    volumes:
      - council-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  council-data:
    name: council-data
