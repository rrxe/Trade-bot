server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript application/json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://min-api.cryptocompare.com https://api.alternative.me https://api.rss2json.com https://api.binance.com https://api-gcp.binance.com https://data-api.binance.vision https://fapi.binance.com wss://stream.binance.com:9443 wss://stream.binance.com wss://data-stream.binance.vision wss://fstream.binance.com" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
